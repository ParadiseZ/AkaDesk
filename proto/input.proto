syntax = "proto3";

package akadesk.v1;

option java_multiple_files = true;
option java_package = "akadesk.v1";

import "common.proto";

enum PointerButton {
  POINTER_BUTTON_UNSPECIFIED = 0;
  POINTER_BUTTON_LEFT = 1;
  POINTER_BUTTON_RIGHT = 2;
  POINTER_BUTTON_MIDDLE = 3;
}

enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_DOWN = 1;
  KEY_ACTION_UP = 2;
}

message PointerEvent {
  uint64 seq = 1;
  float normalized_x = 2;
  float normalized_y = 3;
  PointerButton button = 4;
  bool pressed = 5;
  int64 timestamp_ms = 6;
}

message ScrollEvent {
  uint64 seq = 1;
  float delta_x = 2;
  float delta_y = 3;
  int64 timestamp_ms = 4;
}

message KeyEvent {
  uint64 seq = 1;
  uint32 key_code = 2;
  KeyAction action = 3;
  bool alt = 4;
  bool ctrl = 5;
  bool shift = 6;
  bool meta = 7;
  int64 timestamp_ms = 8;
}

message InputEvent {
  string session_id = 1;

  oneof payload {
    PointerEvent pointer = 2;
    ScrollEvent scroll = 3;
    KeyEvent key = 4;
    TextInputEvent text = 5;
    ReleaseInputEvent release = 6;
    TouchInputEvent touch = 7;
    RelativePointerEvent relative_pointer = 8;
  }
}

// Relative mouse movement in fractions of the captured display size.
message RelativePointerEvent {
  uint64 seq = 1;
  float delta_x = 2;
  float delta_y = 3;
  int64 timestamp_ms = 4;
  PointerButton button = 5;
  bool pressed = 6;
}

// key_code uses Windows virtual-key codes, independent of Android key codes.
// Scroll deltas count wheel detents: +Y scrolls up, +X scrolls right.
message TextInputEvent {
  uint64 seq = 1;
  string text = 2;
  int64 timestamp_ms = 3;
}

message ReleaseInputEvent {
  uint64 seq = 1;
  int64 timestamp_ms = 2;
}

message InputResult {
  string session_id = 1;
  uint64 seq = 2;
  ErrorInfo error = 3;
}

// One complete contact frame, including every active pointer. phase: 1 down, 2 move, 3 up.
message TouchPoint {
  uint32 id = 1;
  float normalized_x = 2;
  float normalized_y = 3;
  uint32 phase = 4;
}
message TouchInputEvent {
  uint64 seq = 1;
  repeated TouchPoint points = 2;
  int64 timestamp_ms = 3;
}
