[package]
name = "desktop-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.44"
host-ipc = { path = "../host/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lib]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
