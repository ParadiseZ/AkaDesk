[package]
name = "host-runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
host-contracts = { path = "../contracts" }
host-ipc = { path = "../ipc" }
mdns-sd = "0.13"
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
host-windows = { path = "../windows" }

[lib]
path = "src/lib.rs"

[build-dependencies]
prost-build = "0.13"
