[package]
name = "host-runtime"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
host-contracts = { path = "../contracts" }
host-ipc = { path = "../ipc" }
mdns-sd = "0.13"
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1.32", features = ["rt-multi-thread", "sync", "time"] }
tungstenite = "0.24"
rtcp = "0.17.1"
webrtc = "0.17.1"

[target.'cfg(windows)'.dependencies]
host-windows = { path = "../windows" }

[lib]
path = "src/lib.rs"

[build-dependencies]
prost-build = "0.13"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
